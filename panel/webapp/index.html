<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>xvpn</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
/* «Кошачья почта»: лавандовая бумага, сакура, коты-сервера, нитки-туннели */
:root{
  --paper:#F4EEFF; --card:#FFFFFF; --ink:#2E2347; --mute:#8C80A8; --line:#E6DCF7;
  --sakura:#FF6FA8; --sakura-soft:#FFE3EF; --mint:#22B892; --honey:#F5A524; --coral:#F2557A;
  --ginger:#FFB36B; --shadow:0 6px 20px -12px #6B4FA580;
  --r-big:24px; --r:16px; --r-s:12px;
  --display:'Comfortaa',ui-rounded,system-ui,sans-serif; --body:'Nunito',ui-rounded,system-ui,sans-serif;
}
body.dark{
  --paper:#1B1530; --card:#261D3F; --ink:#F2EBFF; --mute:#B3A6D8; --line:#3A2E5A;
  --sakura-soft:#4A2741; --shadow:0 8px 24px -14px #000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 var(--body)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sakura);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 4px 10px}
main{padding:16px 14px 8px;max-width:640px;margin:0 auto}
.mute{color:var(--mute)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}

/* дружелюбие: плавное появление карточек, крупные зоны нажатия, отклик кнопок */
.card,.yarn,.stat,.key{animation:rise .3s ease-out both}
.card:nth-of-type(2),.key:nth-of-type(2){animation-delay:.04s}
.card:nth-of-type(3),.key:nth-of-type(3){animation-delay:.08s}
.card:nth-of-type(n+4),.key:nth-of-type(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.btn{min-height:44px;transition:transform .08s ease,opacity .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55}
/* всплывающее «Скопировано» вместо системных окон */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--paper);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* шапка */
.hello{display:flex;align-items:center;gap:12px;padding:4px 4px 2px}
.hello h1{font-size:23px;line-height:1.15}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stat{background:var(--card);border-radius:var(--r-s);padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 20px/1.2 var(--display)}
.stat span{font-size:12px;color:var(--mute)}

/* каскад: главный элемент */
.yarn{background:var(--card);border-radius:var(--r-big);padding:14px 10px 10px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.yarn::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0,var(--sakura-soft),transparent 62%);opacity:.9}
.yarn>*{position:relative}
.yarn h3{font-size:16px;padding:0 6px}
.yarn svg{display:block;width:100%;height:auto;margin-top:2px}
.thread{fill:none;stroke-width:3;stroke-linecap:round}
.thread.on{stroke:var(--sakura);stroke-dasharray:2 9;animation:flow 1.1s linear infinite}
.thread.off{stroke:var(--line);stroke-dasharray:1 7}
@keyframes flow{to{stroke-dashoffset:-11}}
.zz{font:700 11px var(--display);fill:var(--mute);animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{opacity:.25;transform:translateY(-3px)}}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--mute)}
.tag.ok{color:var(--mint)}.tag.bad{color:var(--coral)}.tag.warn{color:var(--honey)}.tag.pink{color:var(--sakura)}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor}

/* серверы */
.srv{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.meter{margin-top:8px}.meter div{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.bar{height:6px;background:var(--paper);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--sakura)}
.bar i.hot{background:var(--coral)}

/* ключи */
.search{display:flex;gap:8px;margin-bottom:12px}
.key{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-s);padding:14px 16px;min-height:66px;margin-bottom:8px;box-shadow:var(--shadow);width:100%;border:0;text-align:left;cursor:pointer;transition:transform .08s ease}
.key:active{transform:scale(.98)}
.paw{width:22px;height:22px;flex:none}
.key .bar{margin-top:6px}

/* кнопки, поля */
.btn{border:0;border-radius:var(--r-s);padding:11px 16px;background:var(--sakura);color:#fff;font-weight:800;cursor:pointer}
.btn.soft{background:var(--paper);color:var(--ink);font-weight:700}
.btn.danger{background:transparent;color:var(--coral);box-shadow:inset 0 0 0 1.5px var(--coral)}
.btn.wide{width:100%}
.btn{white-space:nowrap}
.btn.card-bg{background:var(--card);box-shadow:var(--shadow)}
.srv .btns{gap:6px}.srv .btn{padding:8px 12px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
input{width:100%;padding:11px 13px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--paper);margin:4px 0 10px;outline:0}
input:focus{border-color:var(--sakura)}
label{font-size:13px;color:var(--mute);font-weight:700}
.switch{display:flex;align-items:center;gap:10px;margin-top:10px;cursor:pointer;font-weight:700;font-size:14px}
.switch input{display:none}
.switch s{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch s::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+s{background:var(--mint)}.switch input:checked+s::after{transform:translateX(16px)}

/* пустые состояния */
.empty{text-align:center;padding:26px 16px}
.empty p{margin:8px 0 14px}

/* нижняя навигация */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -8px 24px -18px #6B4FA5;z-index:5}
nav button{flex:1;max-width:120px;border:0;background:none;padding:6px 2px 4px;border-radius:14px;color:var(--mute);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav svg{width:24px;height:24px}
nav button.on{color:var(--sakura);background:var(--sakura-soft)}

/* нижний лист с ушками */
#sheet{position:fixed;inset:0;background:#1B153080;display:none;align-items:flex-end;z-index:10}
#sheet.open{display:flex}
#sheet .panel{position:relative;width:100%;max-width:640px;margin:0 auto;animation:up .22s ease-out}
#s{background:var(--card);max-height:86vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom))}
#ears{position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:120px;height:20px;pointer-events:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
code{display:block;word-break:break-all;font:12px/1.4 ui-monospace,monospace;background:var(--paper);padding:9px 10px;border-radius:10px;margin:6px 0;cursor:pointer}
#qr{display:flex;justify-content:center;margin:14px 0}#qr img,#qr canvas{background:#fff;padding:10px;border-radius:16px}
details summary{cursor:pointer;font-weight:700;color:var(--mute);margin-top:12px}
@media (prefers-reduced-motion:reduce){.thread.on,.zz,#sheet .panel{animation:none}}
</style>
</head>
<body>
<main id="v"><div class="empty" id="boot"></div></main>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target===this)closeS()"><div class="panel"><svg id="ears" viewBox="0 0 120 20" aria-hidden="true"><path d="M8 20 L22 2 L38 20Z M82 20 L98 2 L112 20Z" style="fill:var(--card)"/></svg><div id="s"></div></div></div>
<div id="toast" role="status"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
const dark = tg.colorScheme === 'dark'; if (dark) document.body.classList.add('dark');
try { tg.setHeaderColor(dark ? '#1B1530' : '#F4EEFF'); tg.setBackgroundColor(dark ? '#1B1530' : '#F4EEFF'); } catch (e) {}
const BASE = location.pathname.replace(/\/$/, '');
let ME = null, TAB = 'status', KEYS = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fb(n){n=+n||0;const u=['Б','КБ','МБ','ГБ','ТБ'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return (i?n.toFixed(1):n)+' '+u[i]}
const pct=(a,b)=>b?Math.min(100,Math.round(a*100/b)):0;
const dt=t=>t?new Date(t*1000).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'бессрочно';
const till=t=>t?'до '+dt(t):'бессрочно';
function upt(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600);return d?`${d} д ${h} ч`:`${h} ч ${Math.floor(s%3600/60)} мин`}
async function api(path, method='GET', body){
  const r = await fetch(BASE+'/api'+path,{method,headers:{'X-Init-Data':tg.initData,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).detail}catch(e){}throw new Error(m||r.status)}
  return r.json();
}
const haptic = t => { try { tg.HapticFeedback.notificationOccurred(t) } catch (e) {} };
const hapticTap = () => { try { tg.HapticFeedback.impactOccurred('light') } catch (e) {} };
let _toastT = null;
function note(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function toast(m){tg.showAlert?tg.showAlert(String(m)):alert(m)}
function ask(m){return new Promise(r=>tg.showConfirm?tg.showConfirm(m,r):r(confirm(m)))}
function openS(h){$('#s').innerHTML=h;$('#sheet').classList.add('open')}
function closeS(){$('#sheet').classList.remove('open')}
function copy(t){navigator.clipboard.writeText(t).then(()=>{haptic('success');note('Скопировано 🐾')},()=>toast(t))}

/* ---------- коты (оригинальная рисовка) ---------- */
const COATS = ['#FFF6E9','#D9D3E6','#FFD9B8','#E8D9FF','#CFEFE4','#F3E1C9'];
function cat(mood='happy', coat='#FFF6E9', size=52, extra=''){
  const ink = '#2E2347';
  const eyes = {
    happy:  `<path d="M19 31 Q22.5 26.5 26 31 M38 31 Q41.5 26.5 45 31" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    awake:  `<circle cx="22.5" cy="30.5" r="3.2" fill="${ink}"/><circle cx="41.5" cy="30.5" r="3.2" fill="${ink}"/><circle cx="23.6" cy="29.3" r="1" fill="#fff"/><circle cx="42.6" cy="29.3" r="1" fill="#fff"/>`,
    sleepy: `<path d="M18.5 31 Q22.5 34.5 26.5 31 M37.5 31 Q41.5 34.5 45.5 31" stroke="${ink}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
    worried:`<circle cx="22.5" cy="31" r="2.8" fill="${ink}"/><circle cx="41.5" cy="31" r="2.8" fill="${ink}"/><path d="M18.5 26.5 L25.5 24 M45.5 26.5 L38.5 24" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`,
  }[mood];
  return `<svg viewBox="0 0 64 58" width="${size}" height="${size*58/64}" aria-hidden="true" ${extra}>
    <path d="M10 23 L8.5 5 L24 14.5 Q32 11.5 40 14.5 L55.5 5 L54 23 Q60.5 35 52.5 45 Q44.5 55 32 55 Q19.5 55 11.5 45 Q3.5 35 10 23Z" style="fill:${coat}" stroke="${ink}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M12.5 10 L13.2 19.5 L20.5 15.2Z M51.5 10 L50.8 19.5 L43.5 15.2Z" fill="#FFB3CF"/>
    ${eyes}
    <path d="M30.5 36.2 L33.5 36.2 L32 37.8Z" fill="${ink}" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M27.5 39.5 Q29.7 42.2 32 39.6 Q34.3 42.2 36.5 39.5" stroke="${ink}" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <ellipse cx="16.5" cy="38" rx="3.4" ry="2.1" fill="#FF8FB8" opacity=".55"/><ellipse cx="47.5" cy="38" rx="3.4" ry="2.1" fill="#FF8FB8" opacity=".55"/>
    <path d="M4 34 L12 35.5 M4.5 39.5 L12 38.5 M60 34 L52 35.5 M59.5 39.5 L52 38.5" stroke="${ink}" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
  </svg>`;
}
const pawSvg = c => `<svg class="paw" viewBox="0 0 24 24" aria-hidden="true"><g style="fill:${c}"><ellipse cx="12" cy="15.5" rx="5.2" ry="4.4"/><circle cx="5.6" cy="10.2" r="2.2"/><circle cx="9.4" cy="6.2" r="2.3"/><circle cx="14.6" cy="6.2" r="2.3"/><circle cx="18.4" cy="10.2" r="2.2"/></g></svg>`;
const STATE_COLOR = {active:'var(--mint)',disabled:'var(--mute)',expired:'var(--coral)',limit:'var(--honey)'};
const ST = {active:'активен',disabled:'выключен',expired:'срок истёк',limit:'трафик кончился'};
function srvMood(s){ if(!s.online||!s.status) return 'sleepy'; return s.status.xray.active?'happy':'worried'; }

/* ---------- навигация ---------- */
const TABS = [
  ['status','Котики','<path d="M5 11 L4 3 L9.5 7 Q12 6 14.5 7 L20 3 L19 11 Q21 16 17 19 Q15 21 12 21 Q9 21 7 19 Q3 16 5 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'],
  ['keys','Ключи','<circle cx="8" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12.5 12 H21 M18 12 V15.5 M21 12 V14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
  ['servers','Серверы','<rect x="3.5" y="4" width="17" height="6.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7.5" cy="7.2" r="1.2" fill="currentColor"/><circle cx="7.5" cy="16.7" r="1.2" fill="currentColor"/>'],
  ['admins','Админы','<circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20.5 Q5.5 14.5 12 14.5 Q18.5 14.5 19.5 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
];
$('#nav').innerHTML = TABS.map(([t,l,ic])=>`<button data-t="${t}" class="${t===TAB?'on':''}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  hapticTap(); TAB=b.dataset.t; window.scrollTo(0,0); render();
});

async function render(){
  try{ await ({status:rStatus,keys:rKeys,servers:rServers,admins:rAdmins})[TAB]() }
  catch(e){ $('#v').innerHTML=`<div class="card empty">${cat('worried','#D9D3E6',72)}<p>Панель не отвечает: ${esc(e.message)}</p><button class="btn" onclick="render()">Повторить</button></div>` }
}

/* ---------- схема каскада ---------- */
function groupExits(bridge, servers){
  const by = new Map();
  for (const e of (bridge.status?.exits || [])) {
    const g = by.get(e.server_id) || {id:e.server_id, name:e.name, paths:[]};
    g.paths.push(e); by.set(e.server_id, g);
  }
  return [...by.values()].map(g=>{
    const alive = g.paths.filter(p=>p.alive);
    return {...g, alive: alive.length>0, best: alive.length?Math.min(...alive.map(p=>p.delay||9999)):null};
  });
}
function yarnSvg(bridge, exits){
  const W=340, top=96, rowY=250, n=Math.max(exits.length,1), from=top+64;
  const bridgeUp = bridge.online && bridge.status?.xray?.active;
  let s = `<svg viewBox="0 0 ${W} 320" role="img" aria-label="Схема каскада">`;
  // вы (телефон) → нитка → мост
  s += `<g transform="translate(${W/2-13} 2)"><rect x="0" y="0" width="26" height="40" rx="7" style="fill:var(--card);stroke:${bridgeUp?'var(--sakura)':'var(--line)'}" stroke-width="2"/>
    <rect x="4.5" y="6" width="17" height="24" rx="3" style="fill:${bridgeUp?'var(--sakura-soft)':'var(--paper)'}"/>
    <circle cx="13" cy="34.5" r="2.2" style="fill:var(--mute)"/></g>
    <text x="${W/2}" y="58" text-anchor="middle" font-size="11.5" font-weight="800" style="font-family:var(--body);fill:var(--mute)">это вы</text>
    <path class="thread ${bridgeUp?'on':'off'}" d="M${W/2} 62 C ${W/2} 74, ${W/2} 78, ${W/2} ${top-40}"/>`;
  // нитки
  exits.forEach((e,i)=>{
    const x = W*(i+.5)/n, on = bridgeUp && e.alive;
    s += `<path class="thread ${on?'on':'off'}" d="M${W/2} ${from} C ${W/2} ${from+50}, ${x} ${rowY-86}, ${x} ${rowY-36}"/>`;
    const mx = (W/2 + x)/2 + (x===W/2?0:(x<W/2?-8:8)), my = (from+rowY-36)/2 + 6;
    s += `<g transform="translate(${mx} ${my})"><rect x="-27" y="-11" width="54" height="22" rx="11" style="fill:var(--card);stroke:${on?'var(--sakura)':'var(--line)'}" stroke-width="1.5"/>
      <text text-anchor="middle" y="4.5" font-size="11.5" font-weight="800" style="font-family:var(--body);fill:${on?'var(--sakura)':'var(--mute)'}">${on?(e.best+' мс'):'нет'}</text></g>`;
  });
  // мост
  s += `<g transform="translate(${W/2-34} ${top-38})">${cat(bridgeUp?'happy':(bridge.online?'worried':'sleepy'),'var(--ginger)',68)}</g>
    <text x="${W/2}" y="${top+50}" text-anchor="middle" font-size="12.5" font-weight="800" style="font-family:var(--body);fill:var(--ink)">${esc(bridge.name)}</text>`;
  // выходы
  exits.forEach((e,i)=>{
    const x = W*(i+.5)/n;
    s += `<g transform="translate(${x-26} ${rowY-30})">${cat(e.alive?'happy':'sleepy',COATS[i%COATS.length],52)}</g>`;
    if(!e.alive) s += `<text class="zz" x="${x+20}" y="${rowY-30}">z z</text>`;
    s += `<text x="${x}" y="${rowY+38}" text-anchor="middle" font-size="12.5" font-weight="800" style="font-family:var(--body);fill:var(--ink)">${esc(e.name)}</text>
      <text x="${x}" y="${rowY+54}" text-anchor="middle" font-size="11" style="font-family:var(--body);fill:var(--mute)">${e.paths.filter(p=>p.alive).length}/${e.paths.length} пути</text>`;
  });
  if(!exits.length) s += `<text x="${W/2}" y="${rowY}" text-anchor="middle" font-size="13" style="font-family:var(--body);fill:var(--mute)">Выходов пока нет</text>`;
  return s + '</svg>';
}
function yarnCard(b, servers){
  const exits = groupExits(b, servers);
  const alive = exits.filter(e=>e.alive);
  const best = alive.sort((a,c)=>a.best-c.best)[0];
  const resting = servers.filter(s=>s.role==='exit' && s.enabled && !s.cascade);
  let note;
  if(!b.online) note = `<span class="tag bad"><i></i>мост не на связи</span>`;
  else if(!exits.length) note = `<span class="tag warn"><i></i>включите выходы во вкладке «Серверы»</span>`;
  else if(!alive.length) note = `<span class="tag bad"><i></i>все выходы спят — трафик за рубеж не идёт</span>`;
  else note = `<span class="tag ok"><i></i>сейчас через ${esc(best.name)}</span>${alive.length<exits.length?`<span class="tag warn"><i></i>в резерве ${exits.length-alive.length} спит</span>`:`<span class="tag pink"><i></i>резерв: ${alive.length-1}</span>`}`;
  return `<section class="yarn"><h3>Каскад</h3>${yarnSvg(b, exits)}
    <div class="legend">${note}<span class="tag"><i></i>российские сайты — напрямую</span>${resting.length?`<span class="tag">💤 отдыхают: ${resting.map(s=>esc(s.name)).join(', ')}</span>`:''}</div></section>`;
}

function clusterCard(o){
  const cl=o.cluster, bridges=o.servers.filter(s=>s.role==='bridge');
  const b0=bridges.find(b=>b.online&&b.status)||bridges[0]||{status:null};
  const exits=groupExits(b0,o.servers);
  const upIps=new Set(bridges.filter(b=>b.online&&b.status?.xray?.active).map(b=>b.info?.ip));
  const ips=cl.addrs||[];
  const upCnt=ips.length?ips.filter(ip=>upIps.has(ip)).length:upIps.size;
  const total=ips.length||bridges.length;
  const bt=bridges.reduce((a,b)=>a+(b.status?.net?(+b.status.net.sent+(+b.status.net.recv)):0),0);
  const alive=exits.filter(e=>e.alive), best=alive.sort((a,c)=>a.best-c.best)[0];
  const resting=o.servers.filter(s=>s.role==='exit'&&s.enabled&&!s.cascade);
  const bal=o.balancer;
  const W=340, top=118, rowY=250, n=Math.max(exits.length,1), from=top+34;
  const clUp=upCnt>0;
  let s=`<svg viewBox="0 0 ${W} 306" role="img" aria-label="Схема кластера">`;
  s+=`<g transform="translate(${W/2-13} 0)"><rect x="0" y="0" width="26" height="40" rx="7" style="fill:var(--card);stroke:${clUp?'var(--sakura)':'var(--line)'}" stroke-width="2"/>
    <rect x="4.5" y="6" width="17" height="24" rx="3" style="fill:${clUp?'var(--sakura-soft)':'var(--paper)'}"/>
    <circle cx="13" cy="34.5" r="2.2" style="fill:var(--mute)"/></g>
    <text x="${W/2}" y="56" text-anchor="middle" font-size="11.5" font-weight="800" style="font-family:var(--body);fill:var(--mute)">это вы</text>
    <path class="thread ${clUp?'on':'off'}" d="M${W/2} 58 C ${W/2} 68, ${W/2} 70, ${W/2} ${top-44}"/>`;
  const bw=W-40, bx=(W-bw)/2;
  s+=`<g><rect x="${bx}" y="${top-44}" width="${bw}" height="78" rx="18" style="fill:var(--card);stroke:${clUp?'var(--sakura)':'var(--line)'}" stroke-width="2"/>
    <text x="${W/2}" y="${top-19}" text-anchor="middle" font-size="13" font-weight="800" style="font-family:var(--body);fill:var(--ink)">Кластер RU</text>
    <text x="${W/2}" y="${top-5}" text-anchor="middle" font-size="10.5" style="font-family:var(--body);fill:var(--mute)">${esc(cl.host)} · ${upCnt} из ${total} точек на связи</text>`;
  const dn=Math.max(ips.length,1), dw=Math.min(84,(bw-24)/dn);
  ips.forEach((ip,i)=>{
    const x=W/2+(i-(dn-1)/2)*dw, on=upIps.has(ip);
    s+=`<circle cx="${x}" cy="${top+13}" r="5" style="fill:${on?'var(--sakura)':'var(--line)'}"/>
      <text x="${x}" y="${top+29}" text-anchor="middle" font-size="9.5" style="font-family:var(--body);fill:${on?'var(--ink)':'var(--mute)'}">·${ip.split('.').pop()}</text>`;
  });
  s+='</g>';
  exits.forEach((e,i)=>{
    const x=W*(i+.5)/n, on=clUp&&e.alive;
    s+=`<path class="thread ${on?'on':'off'}" d="M${W/2} ${from} C ${W/2} ${from+42}, ${x} ${rowY-82}, ${x} ${rowY-36}"/>`;
    const mx=(W/2+x)/2+(x===W/2?0:(x<W/2?-8:8)), my=(from+rowY-36)/2+6;
    s+=`<g transform="translate(${mx} ${my})"><rect x="-27" y="-11" width="54" height="22" rx="11" style="fill:var(--card);stroke:${on?'var(--sakura)':'var(--line)'}" stroke-width="1.5"/>
      <text text-anchor="middle" y="4.5" font-size="11.5" font-weight="800" style="font-family:var(--body);fill:${on?'var(--sakura)':'var(--mute)'}">${on?(e.best+' мс'):'нет'}</text></g>`;
  });
  exits.forEach((e,i)=>{
    const x=W*(i+.5)/n;
    s+=`<g transform="translate(${x-26} ${rowY-30})">${cat(e.alive?'happy':'sleepy',COATS[i%COATS.length],52)}</g>`;
    if(!e.alive) s+=`<text class="zz" x="${x+20}" y="${rowY-30}">z z</text>`;
    const served=bal&&bal.served[e.id]!=null?fb(bal.served[e.id]):'';
    s+=`<text x="${x}" y="${rowY+38}" text-anchor="middle" font-size="12.5" font-weight="800" style="font-family:var(--body);fill:var(--ink)">${esc(e.name)}</text>
      <text x="${x}" y="${rowY+53}" text-anchor="middle" font-size="10.5" style="font-family:var(--body);fill:var(--mute)">${served?served+' за месяц':e.paths.filter(p=>p.alive).length+'/'+e.paths.length+' пути'}</text>`;
  });
  if(!exits.length) s+=`<text x="${W/2}" y="${rowY}" text-anchor="middle" font-size="13" style="font-family:var(--body);fill:var(--mute)">Выходов пока нет</text>`;
  s+='</svg>';
  let note;
  if(!bridges.length) note=`<span class="tag bad"><i></i>мосты не добавлены</span>`;
  else if(!clUp) note=`<span class="tag bad"><i></i>все точки входа спят</span>`;
  else if(!alive.length) note=`<span class="tag bad"><i></i>все выходы спят — трафик за рубеж не идёт</span>`;
  else note=`<span class="tag ok"><i></i>сейчас через ${esc(best.name)}</span><span class="tag pink"><i></i>трафик через мосты: ${fb(bt)}</span>`;
  return `<section class="yarn"><h3>Кластер</h3>${s}
    <div class="legend">${note}<span class="tag"><i></i>российские сайты — напрямую</span>${resting.length?`<span class="tag">💤 отдыхают: ${resting.map(s=>esc(s.name)).join(', ')}</span>`:''}</div></section>`;
}

/* ---------- вкладка «Котики» ---------- */
function greet(){const h=new Date().getHours();return h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Привет':'Добрый вечер'}
async function rStatus(){
  const o = await api('/overview');
  const bal = o.balancer;
  const bridges = o.servers.filter(s=>s.role==='bridge');
  const allUp = o.servers.length && o.servers.every(s=>s.online&&s.status?.xray?.active);
  let h = `<header class="hello">${cat(allUp?'happy':(o.servers.length?'worried':'awake'),'#FFF6E9',58)}
    <div><h1>${greet()}, ${esc(ME.first_name||'хозяин')}</h1>
    <div class="mute small">${!o.servers.length?'Серверов пока нет':allUp?'Все коты мурчат — всё работает':'Кто-то из котов спит — загляните ниже'}</div></div></header>
    <div class="stats"><div class="stat"><b>${o.keys_active}<span class="mute" style="font-size:14px">/${o.keys_total}</span></b><span>активных ключей</span></div>
    <div class="stat"><b>${o.keys_online}</b><span>онлайн сейчас</span></div>
    <div class="stat"><b>${fb(o.traffic_total).replace(' ','&nbsp;')}</b><span>трафик всего</span></div></div>`;
  h += o.cluster ? clusterCard(o) : bridges.map(b=>yarnCard(b,o.servers)).join('');
  if(!bridges.length && o.servers.length && ME.is_owner) h += `<div class="card row">${cat('awake','#FFB36B',44)}<div class="grow small"><b>Каскада нет.</b> Поставьте мост на российский VPS — он работает даже при белых списках. Команда во вкладке «Серверы».</div></div>`;
  if(o.servers.length) h += `<h2>Серверы</h2>`;
  for(const s of o.servers){
    const st=s.status, up=s.online&&st;
    h += `<article class="card srv">${cat(srvMood(s), s.role==='bridge'?'var(--ginger)':COATS[(s.id-1)%COATS.length],52)}
      <div><div class="row"><b class="grow">${esc(s.name)}</b><span class="tag ${s.role==='bridge'?'pink':''}">${s.role==='bridge'?'мост':'выход'}</span>${s.role!=='bridge'?`<span class="tag ${s.cascade?'ok':''}"><i></i>${s.cascade?'в каскаде':'отдыхает'}</span>`:''}</div>`;
    if(up){
      h += `<div class="mute small">${st.xray.active?`Xray работает, ключей ${st.xray.users}`:'<b style="color:var(--coral)">Xray остановлен</b>'} · аптайм ${upt(st.uptime)}</div>
        ${meter('Процессор', `${st.cpu.toFixed(0)}%`, st.cpu)}
        ${meter('Память', `${fb(st.ram.used)} из ${fb(st.ram.total)}`, pct(st.ram.used,st.ram.total))}
        ${meter('Диск', `${fb(st.disk.used)} из ${fb(st.disk.total)}`, pct(st.disk.used,st.disk.total))}
        ${bal&&bal.served[s.id]!=null?meter('Отдано за месяц', `${fb(bal.served[s.id])} из ${fb(bal.limit_bytes)}`, pct(bal.served[s.id],bal.limit_bytes)):''}
        <div class="btns"><button class="btn soft" onclick="restart(${s.id})">Перезапустить Xray</button></div>`;
    } else h += `<div class="mute small">Спит: нет связи с агентом${s.last_seen?' с '+new Date(s.last_seen*1000).toLocaleString('ru-RU'):''}</div>`;
    h += `</div></article>`;
  }
  if(!o.servers.length) h += `<div class="card empty">${cat('sleepy','#D9D3E6',72)}<p>Добавьте первый сервер — и тут появится его кот.</p><button class="btn" onclick="go('servers')">Добавить сервер</button></div>`;
  else h += `<button class="btn soft card-bg wide" style="margin-top:4px" onclick="syncNow(this)">Синхронизировать сейчас</button>
    <div class="mute small" style="text-align:center;margin-top:8px">Обновлено в ${new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})} · само обновляется каждые 15 сек</div>`;
  $('#v').innerHTML = h;
}
const meter=(l,v,p)=>`<div class="meter"><div><span>${l}</span><span>${v}</span></div><div class="bar"><i class="${p>85?'hot':''}" style="width:${p}%"></i></div></div>`;
function go(t){document.querySelector(`nav button[data-t="${t}"]`).click()}
async function restart(id){if(await ask('Перезапустить Xray? Соединения на пару секунд прервутся.')){try{await api(`/servers/${id}/restart`,'POST');haptic('success');note('Xray перезапущен 🐾')}catch(e){toast(e.message)}}}

  if(ME.is_owner) h += `<h2>Добавить сервер</h2><div class="card">
   <div class="mute small">Обычная нода: <code>bash &lt;(curl -fsSL https://raw.githubusercontent.com/duboshin52/xvpn/main/install.sh) node</code>
   Мост на российском VPS: <code>bash &lt;(curl -fsSL https://raw.githubusercontent.com/duboshin52/xvpn/main/install.sh) bridge</code>
   Установщик в конце покажет код подключения. Его же можно добавить командой <b>xvpn server add КОД</b>.</div>
   <label for="sn">Название</label><input id="sn" placeholder="например, NL-1 или RU-Яндекс">
   <label for="su">Код подключения или URL агента</label><input id="su" placeholder="eyJ1Ijo… или https://…">
   <label for="ss">Секрет агента (только для URL)</label><input id="ss" placeholder="не нужен, если вставлен код">
   <button class="btn wide" onclick="sAdd(this)">Добавить сервер</button></div>`;
  $('#v').innerHTML=h;
}
async function setCdn(v){try{await api('/settings','PATCH',{cdn:v});haptic('success')}catch(e){toast(e.message)}rServers()}
async function setEmergency(v){try{await api('/settings','PATCH',{emergency:v});haptic('success');toast(v?'Аварийный канал включён. Клиентам — обновить подписку':'Аварийный канал скрыт')}catch(e){toast(e.message)}rServers()}
async function sAdd(b){b.disabled=true;try{await api('/servers','POST',{name:$('#sn').value,url:$('#su').value,secret:$('#ss').value});haptic('success');rServers()}catch(e){toast(e.message);b.disabled=false}}
async function sEdit(id,b){try{await api(`/servers/${id}`,'PATCH',b);haptic('success');rServers()}catch(e){toast(e.message);rServers()}}
function sRen(id){inputS('Новое имя сервера','','text',v=>{closeS();v&&sEdit(id,{name:v})})}
async function sDel(id){if(await ask('Убрать сервер из панели? На самом сервере ничего не удалится.')){await api(`/servers/${id}`,'DELETE');rServers()}}

/* ---------- админы ---------- */
async function rAdmins(){
  const a=await api('/admins');
  let h=a.map((x,i)=>`<div class="card row">${cat(x.is_owner?'happy':'awake',x.is_owner?'var(--ginger)':COATS[i%COATS.length],40)}
   <div class="grow"><b>${esc(x.name||'Без имени')}</b><div class="mute small">${x.is_owner?'Владелец':'Админ'}, ID ${x.tg_id}</div></div>
   ${ME.is_owner&&!x.is_owner?`<button class="btn danger" onclick="aDel(${x.tg_id})">Убрать</button>`:''}</div>`).join('');
  if(ME.is_owner) h+=`<h2>Добавить админа</h2><div class="card"><div class="mute small" style="margin-bottom:8px">Пусть человек отправит боту /id — так вы узнаете его Telegram ID. Админ управляет ключами, но не серверами.</div>
   <label for="ai">Telegram ID</label><input id="ai" type="number" inputmode="numeric"><label for="an">Имя</label><input id="an" placeholder="необязательно">
   <button class="btn wide" onclick="aAdd(this)">Добавить админа</button></div>`;
  else h+=`<div class="card mute small">Добавлять и убирать админов может только владелец.</div>`;
  $('#v').innerHTML=h;
}
async function aAdd(b){b.disabled=true;try{await api('/admins','POST',{tg_id:+$('#ai').value,name:$('#an').value});haptic('success');rAdmins()}catch(e){toast(e.message);b.disabled=false}}
async function aDel(id){if(await ask('Убрать админа?')){await api(`/admins/${id}`,'DELETE');rAdmins()}}

/* ---------- старт ---------- */
$('#boot').innerHTML = cat('awake','#FFF6E9',72) + '<p class="mute">Зовём котов…</p>';
(async()=>{
  if(!tg.initData){$('#v').innerHTML=`<div class="card empty">${cat('awake','#FFF6E9',72)}<p>Откройте панель из Telegram-бота: команда /start, кнопка «Открыть панель».</p></div>`;return}
  try{ME=await api('/me')}catch(e){$('#v').innerHTML=`<div class="card empty">${cat('worried','#D9D3E6',72)}<p>Нет доступа: ${esc(e.message)}</p></div>`;return}
  render(); setInterval(()=>{if(TAB==='status'&&!$('#sheet').classList.contains('open'))render()},15000);
})();
</script>
</body>
